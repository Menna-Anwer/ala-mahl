<header>
  <nav class="container-xl" aria-label="التنقل الرئيسي">
    <a routerLink="/week" class="brand"
      ><span><i class="fa-solid fa-seedling" aria-hidden="true"></i></span>على مهل</a
    ><button
      class="menu"
      (click)="open.set(!open())"
      aria-label="فتح القائمة"
      [attr.aria-expanded]="open()"
    >
      <i class="fa-solid fa-bars" aria-hidden="true"></i>
    </button>
    <div class="links" [class.open]="open()">
      <a routerLink="/week" routerLinkActive="active" (click)="open.set(false)">الأسبوع</a
      ><a routerLink="/topics" routerLinkActive="active" (click)="open.set(false)">الموضوعات</a
      ><a routerLink="/review" routerLinkActive="active" (click)="open.set(false)">المراجعة</a>
    </div>
  </nav>
</header>
